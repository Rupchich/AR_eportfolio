    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <header class="header">

        <div class="container navbar">

            <a href="index.html" class="logo">
                ePortfolio - Antonio Rupčić
            </a>

            <nav class="nav-menu" id="navMenu">

                <a href="index.html">Naslovna</a>

            </nav>

            <div class="hamburger" id="hamburger">
                <i class="fa-solid fa-bars"></i>
            </div>

        </div>

    </header>

    <main>

        <section class="contact-page">

            <div class="container">

                <h1 class="contact-title">Kontakt</h1>

                <p class="contact-subtitle">
                    Za pitanja, prijedloge ili suradnje slobodno me kontaktiraj putem e-maila ili preko socijalnih mreža.
                </p>

                <form class="contact-form">

                    <div class="form-group">

                        <label>Ime i Prezime</label>

                        <input
                            type="text"
                            placeholder="Unesite ime i prezime"
                        >

                    </div>

                    <div class="form-group">

                        <label>Email</label>

                        <input
                            type="email"
                            placeholder="Unesite email adresu"
                        >

                    </div>

                    <div class="form-group">

                        <label>Poruka</label>

                        <textarea
                            placeholder="Unesite poruku"
                        ></textarea>

                    </div>

                    <div class="contact-button-wrapper">

                        <button type="submit" class="hero-button">
                            Pošalji
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <footer class="footer">

        <div class="container footer-content">

            <p>Kontakt: antonio.rupcic@uniri.hr</p>

            <div class="social-icons">

                <a href="https://github.com/Rupchich">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="https://www.instagram.com/roopchich/">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="https://www.linkedin.com/in/antonio-rupcic-2468482ba/">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>

            </div>

        </div>

    </footer>

    <script src="js/main.js"></script>
